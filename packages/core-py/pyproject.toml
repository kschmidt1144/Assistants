[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assistants-core"
version = "0.1.0"
description = "Shared Python core for the Assistants apps: Gemini Live + Claude providers, model registry, doc parsing, SQLite persistence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "google-genai>=1.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "python-multipart>=0.0.9",
  "aiosqlite>=0.20",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
# Higher-quality local speaker embeddings (pulls torch + librosa). Optional — a pure-numpy
# SpectralEmbedder fallback works without it. Install: pip install -e "packages/core-py[speaker]"
speaker = [
  "resemblyzer>=0.1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["assistants_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: tests that hit real provider APIs (require API keys); skipped offline",
]
